version: '3.8'
services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [publica, privada]
    depends_on: [kong]

  kong:
    image: kong:3
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
    volumes:
      - ./kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    networks: [privada]
    depends_on: [usuarios, productos, pedidos]

  usuarios:
    build: ./usuarios
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:app@db-usuarios/usuarios
    networks: [privada]
    depends_on: [db-usuarios]

  db-usuarios:
    image: postgres:16-alpine
    environment: 
      POSTGRES_PASSWORD: app
      POSTGRES_DB: usuarios
    networks: [privada]

  productos:
    build: ./productos
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:app@db-productos/productos
    networks: [privada]
    depends_on: [db-productos]

  db-productos:
    image: postgres:16-alpine
    environment: 
      POSTGRES_PASSWORD: app
      POSTGRES_DB: productos
    networks: [privada]

  pedidos:
    build: ./pedidos
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:app@db-pedidos/pedidos
    networks: [privada]
    depends_on: [db-pedidos]

  db-pedidos:
    image: postgres:16-alpine
    environment: 
      POSTGRES_PASSWORD: app
      POSTGRES_DB: pedidos
    networks: [privada]

networks:
  publica:
  privada:
    internal: true
